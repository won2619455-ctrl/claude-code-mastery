<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50:  '#eff6ff',
              100: '#dbeafe',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">

  <!-- 헤더 -->
  <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">✅</span>
        <h1 class="text-xl font-bold text-gray-800 dark:text-white">Todo List</h1>
      </div>
      <button id="darkModeToggle" aria-label="다크모드 토글"
        class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
        <svg id="iconSun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 7a5 5 0 100 10A5 5 0 0012 7z"/>
        </svg>
        <svg id="iconMoon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="max-w-5xl mx-auto px-4 py-6 flex gap-6">

    <!-- 사이드바: 카테고리 (데스크탑) -->
    <aside class="w-44 shrink-0 hidden md:block">
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4">
        <h2 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-3">카테고리</h2>
        <ul id="categoryList" class="space-y-1"></ul>
        <!-- 카테고리 추가 폼 -->
        <form id="categoryForm" class="mt-3 flex gap-1">
          <input id="categoryInput" type="text" placeholder="새 카테고리"
            class="flex-1 min-w-0 text-sm px-2 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500" />
          <button type="submit"
            class="px-2 py-1.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm transition-colors">+</button>
        </form>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="flex-1 min-w-0">

      <!-- 모바일 카테고리 탭 -->
      <div class="md:hidden mb-4">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-3">
          <div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide"></div>
          <form id="categoryFormMobile" class="mt-2 flex gap-1">
            <input id="categoryInputMobile" type="text" placeholder="새 카테고리 추가"
              class="flex-1 text-sm px-2 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500" />
            <button type="submit"
              class="px-3 py-1.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm transition-colors">+</button>
          </form>
        </div>
      </div>

      <!-- 입력 영역 -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 mb-4">
        <form id="todoForm" class="flex gap-2">
          <input id="todoInput" type="text" placeholder="할 일을 입력하세요..." autocomplete="off"
            class="flex-1 px-4 py-2.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors" />
          <select id="todoCategory"
            class="px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition-colors">
          </select>
          <button type="submit"
            class="px-4 py-2.5 bg-primary-600 hover:bg-primary-700 active:bg-primary-800 text-white font-medium rounded-lg transition-colors whitespace-nowrap">
            추가
          </button>
        </form>
      </div>

      <!-- 할 일 목록 -->
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm">
        <ul id="todoList" class="divide-y divide-gray-100 dark:divide-gray-700"></ul>

        <!-- 빈 상태 -->
        <div id="emptyState" class="hidden py-16 text-center">
          <p class="text-4xl mb-3">📝</p>
          <p class="text-gray-500 dark:text-gray-400 text-sm">할 일이 없습니다. 새로운 할 일을 추가해보세요!</p>
        </div>

        <!-- 하단 바 -->
        <div id="footerBar" class="hidden px-4 py-3 flex items-center justify-between border-t border-gray-100 dark:border-gray-700">
          <span id="remainCount" class="text-sm text-gray-500 dark:text-gray-400"></span>
          <button id="clearCompleted"
            class="text-sm text-red-500 hover:text-red-600 dark:text-red-400 dark:hover:text-red-300 transition-colors">
            완료 항목 삭제
          </button>
        </div>
      </div>

    </main>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
